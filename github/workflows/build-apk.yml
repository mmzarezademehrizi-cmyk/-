name: build-apk
on:
  workflow_dispatch:
    inputs:
      id: { required: true }
      name: { required: true }
      url: { required: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ID: ${{ inputs.id }}
      APP_NAME: ${{ inputs.name }}
      APP_URL: ${{ inputs.url }}
      SITE: ${{ secrets.SITE_URL }}
      SECRET: ${{ secrets.UPLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Prepare icon and strings
        run: |
          curl -fsSL "$SITE/api/icon?id=$ID" -o icon.src
          D=android-template/app/src/main/res
          mkdir -p $D/drawable
          convert "icon.src[0]" -resize 192x192^ -gravity center -extent 192x192 $D/drawable/ic_launcher.png
          python3 - <<'PY'
          import os
          from xml.sax.saxutils import escape
          def x(s): return escape(s).replace("'", "\\'").replace('"', '\\"')
          n = x(os.environ["APP_NAME"]); u = escape(os.environ["APP_URL"])
          open("android-template/app/src/main/res/values/strings.xml","w",encoding="utf-8").write(
            f'<resources><string name="app_name">{n}</string><string name="app_url" translatable="false">{u}</string></resources>')
          PY
      - name: Build APK
        working-directory: android-template
        run: gradle assembleDebug -PappId=com.webapp.u${ID//-/}
      - name: Upload APK to site
        run: curl -fsS -X POST -H "x-secret: $SECRET" --data-binary @android-template/app/build/outputs/apk/debug/app-debug.apk "$SITE/api/upload?id=$ID"
      - name: Report failure
        if: failure()
        run: curl -sS -X POST -H "x-secret: $SECRET" "$SITE/api/upload?id=$ID&fail=1"
