<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سایتت را اپ کن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#f4f7f6;--ink:#12201d;--mut:#5b6b67;--acc:#0f766e;--line:#cdd8d5;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
main{max-width:920px;margin:0 auto;padding:40px 20px;display:grid;grid-template-columns:1fr 240px;gap:40px;align-items:start}
h1{font-size:2.2rem;font-weight:900;margin:0 0 6px}
p.sub{color:var(--mut);margin:0 0 28px}
label{display:block;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=url],input[type=file]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit}
input:focus,button:focus-visible{outline:3px solid #99d5cf;outline-offset:1px}
button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:16px;min-height:1.8em}
#msg.err{color:#b42318}
#dl{display:none;margin-top:12px;text-align:center;padding:14px;border-radius:8px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700}
.phone{border:8px solid var(--ink);border-radius:32px;background:var(--card);height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:sticky;top:24px}
.phone img{width:84px;height:84px;border-radius:20px;object-fit:cover;background:var(--line)}
.phone span{font-weight:700;max-width:90%;text-align:center;overflow-wrap:anywhere}
@media(max-width:700px){main{grid-template-columns:1fr}.phone{display:none}}
</style>
</head>
<body>
<main>
<section>
  <h1>سایتت را اپ کن</h1>
  <p class="sub">اسم، آیکون و لینک سایتت را بده؛ فایل اپ اندروید را دانلود کن.</p>
  <form id="f">
    <label for="name">اسم اپ</label>
    <input type="text" id="name" name="name" maxlength="30" required>
    <label for="icon">آیکون اپ (png، jpg یا webp، حداکثر ۱ مگابایت)</label>
    <input type="file" id="icon" name="icon" accept="image/png,image/jpeg,image/webp" required>
    <label for="url">لینک سایت</label>
    <input type="url" id="url" name="url" placeholder="https://example.com" dir="ltr" required>
    <button id="go">ساخت اپ</button>
  </form>
  <div id="msg" role="status"></div>
  <a id="dl">دانلود فایل اپ</a>
</section>
<div class="phone" aria-hidden="true"><img id="pi" alt=""><span id="pn">اسم اپ</span></div>
</main>
<script>
const $=id=>document.getElementById(id),msg=$('msg');
$('name').oninput=e=>$('pn').textContent=e.target.value||'اسم اپ';
$('icon').onchange=e=>{const f=e.target.files[0];if(f)$('pi').src=URL.createObjectURL(f)};
const say=(t,err)=>{msg.textContent=t;msg.className=err?'err':''};
$('f').onsubmit=async e=>{
  e.preventDefault();$('go').disabled=true;$('dl').style.display='none';say('در حال ارسال...');
  try{
    const r=await fetch('/api/build',{method:'POST',body:new FormData(e.target)});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'خطا');
    say('اپ در حال ساخت است؛ معمولاً ۲ تا ۴ دقیقه طول می‌کشد.');
    const t=setInterval(async()=>{
      const s=await (await fetch('/api/status?id='+j.id)).json();
      if(s.status==='done'){clearInterval(t);say('اپ آماده است.');$('dl').href='/api/download?id='+j.id;$('dl').style.display='block';$('go').disabled=false}
      if(s.status==='failed'){clearInterval(t);say('ساخت اپ ناموفق بود. دوباره امتحان کن.',1);$('go').disabled=false}
    },5000);
  }catch(x){say(x.message,1);$('go').disabled=false}
};
</script>
</body>
</html>
